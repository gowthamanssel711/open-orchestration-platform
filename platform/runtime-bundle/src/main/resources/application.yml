spring:
  application:
    name: runtime-bundle
  main:
    allow-bean-definition-overriding: true
  cloud:
    function:
      autodetect: false
    stream:
      default-binder: rabbit
      bindings:
        engineEvents-out-0:
          destination: engineEvents
          content-type: application/json
        taskEvents-out-0:
          destination: taskEvents
          content-type: application/json
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/oop_runtime
    username: ${DB_USERNAME:oop}
    password: ${DB_PASSWORD:oop-dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:oop}
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:oop}/protocol/openid-connect/certs
      client:
        registration:
          keycloak:
            client-id: activiti-keycloak
            client-secret: activiti-keycloak-secret
            authorization-grant-type: client_credentials
            scope: openid
        provider:
          activiti-keycloak:
            token-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:oop}/protocol/openid-connect/token

activiti:
  cloud:
    application:
      name: ${spring.application.name}
    messaging:
      destination-transformers-enabled: false
  security:
    policies:
      - name: defaultPolicy
        match:
          any: true
        users:
          - '*'
        access: WRITE
keycloak:                                              # <-- ADD THIS
  auth-server-url: ${KEYCLOAK_URL:http://localhost:8180}
  realm: ${KEYCLOAK_REALM:oop}

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  level:
    org.activiti: INFO
    com.oop: DEBUG

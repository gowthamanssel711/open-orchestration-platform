name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oop
          POSTGRES_PASSWORD: oop-dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build
        run: mvn clean package -DskipTests -B

      - name: Test
        run: mvn test -B

      - name: Check formatting
        run: mvn spotless:check

  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Build
        run: pnpm build
        working-directory: .

      - name: Test
        run: pnpm test
        working-directory: .

      - name: Check formatting
        run: pnpm format:check
        working-directory: .

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [backend]
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build services
        run: mvn clean package -DskipTests -B

      - name: Start Docker Compose stack
        run: docker compose up -d --build

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for all services..."
          for i in $(seq 1 48); do
            ALL_UP=true
            for port in 8080 8081 8082 8083 8084 8085 8087; do
              curl -sf "http://localhost:$port/actuator/health" > /dev/null 2>&1 || ALL_UP=false
            done
            if [ "$ALL_UP" = "true" ]; then
              echo "All services healthy!"
              exit 0
            fi
            printf "."
            sleep 5
          done
          echo "Services did not become healthy"
          docker compose logs --tail=100
          exit 1

      - name: Run integration tests
        run: mvn verify -pl test/integration -Pintegration -B

      - name: Collect logs on failure
        if: failure()
        run: docker compose logs > docker-compose-logs.txt

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-logs
          path: docker-compose-logs.txt

      - name: Tear down
        if: always()
        run: docker compose down -v

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    strategy:
      matrix:
        service:
          - runtime-bundle
          - query-service
          - audit-service
          - analytics-service
          - notification-service
          - identity-service
          - gateway

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.java
          build-args: SERVICE_NAME=${{ matrix.service }}
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
